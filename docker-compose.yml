version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dispute_guard
      POSTGRES_PASSWORD: dispute_guard
      POSTGRES_DB: dispute_guard
    ports:
      - "5432:5432"
    volumes:
      - dispute_guard_pgdata:/var/lib/postgresql/data

volumes:
  dispute_guard_pgdata:
